{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ut@ngina{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="sticky top-0 z-50 bg-slate-800 text-white px-6 py-4 flex justify-between items-center">
        <a href="{% url 'dashboard' %}" class="font-bold text-lg">UT@NGINA</a>
        <div class="space-x-4">
            {% if user.is_authenticated %}
                <span class="text-slate-300">Hi, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="hover:underline">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="hover:underline">Login</a>
                <a href="{% url 'register' %}" class="hover:underline">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="max-w-3xl mx-auto p-6">
        
        <!-- Toast container -->
        <div id="toast-container" class="fixed top-6 right-4 z-50 space-y-2 w-80 max-w-[calc(100vw-2rem)]">
            {% for message in messages %}
            <div class="toast flex items-start gap-2 px-4 py-3 rounded shadow-lg text-sm font-medium
                {% if message.tags == 'success' %}bg-green-600 text-white
                {% elif message.tags == 'error' %}bg-red-600 text-white
                {% elif message.tags == 'warning' %}bg-yellow-500 text-white
                {% else %}bg-blue-500 text-white{% endif %}">
                <span class="flex-1">{{ message }}</span>
                <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100">&times;</button>
            </div>
            {% endfor %}
        </div>

        {% block content %}{% endblock %}
    </main>

    <!-- Toast script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toasts = document.querySelectorAll('.toast');
            toasts.forEach((toast, index) => {
                setTimeout(() => {
                    toast.style.transition = 'opacity 0.3s ease';
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000 + (index * 300)); // stagger multiple toasts slightly
            });
        });
    </script>
</body>
</html>
